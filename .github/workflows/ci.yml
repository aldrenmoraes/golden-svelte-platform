name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify, build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The gate runs without infrastructure: no step connects to Postgres, but modules that read
      # configuration at import time still expect these to be present.
      DATABASE_URL: postgres://app:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret-with-at-least-32-characters
      ORIGIN: http://localhost:3000
      APP_VERSION: 0.0.0-ci
      GIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (check, lint, test, i18n)
        run: bun run verify

      - name: Build application
        run: bun run build

      - name: Build Docker image
        run: docker build . -t app:test
